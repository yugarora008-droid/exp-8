<!doctype html> 
<html lang="en"> 
<head> 
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Book Collection</title> 
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head> 
<body class="container py-4"> 
<h1>Book Collection</h1> 
<form id="book-form" class="input-group my-3"> 
<input id="title" class="form-control" placeholder="Book title" required> 
<input id="author" class="form-control" placeholder="Author" required> 
<input id="year" type="number" class="form-control" placeholder="Year" required> 
<button class="btn btn-primary">Add Book</button> 
</form> 
<ul id="book-list" class="list-group"></ul> 
<script src="script.js"></script> 
</body> 
</html>
